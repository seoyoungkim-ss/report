<title>썸머탈출 페스티벌</title>
<style>
:root{
  --bg:#071428; --bg2:#0b1e3d; --panel:#0f2547; --panel2:#122c56;
  --line:#1c3a68; --text:#eaf4ff; --sub:#9db4d9;
  --orange:#ff7a29; --orange2:#ffb648; --cyan:#26e0d9; --cyan2:#7bf1ec;
  --gold:#ffd166; --red:#ff5c5c; --green:#3ddc84;
}
*{box-sizing:border-box;}
body{background:var(--bg);color:var(--text);}
.app{min-height:100vh;background:
  radial-gradient(1200px 600px at 10% -10%, #123464 0%, transparent 60%),
  radial-gradient(1000px 500px at 110% 10%, #1a1030 0%, transparent 55%),
  linear-gradient(180deg,var(--bg) 0%, #050e1e 100%);
  font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  padding:0;position:relative;overflow-x:hidden;}
button{font-family:inherit;cursor:pointer;}
input,select{font-family:inherit;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px;}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;
  padding:18px 32px;background:linear-gradient(90deg,#0a1c3a,#0f2a52 60%,#0a1c3a);
  border-bottom:3px solid var(--orange);position:relative;z-index:2;}
.brand{display:flex;align-items:center;gap:14px;}
.brand .emoji{font-size:34px;filter:drop-shadow(0 0 10px rgba(255,122,41,.6));}
.brand h1{margin:0;font-size:26px;letter-spacing:1px;
  background:linear-gradient(90deg,var(--orange2),var(--cyan2));
  -webkit-background-clip:text;background-clip:text;color:transparent;font-weight:900;}
.daybadge{display:flex;align-items:center;gap:12px;background:var(--panel);
  border:2px solid var(--cyan);border-radius:14px;padding:8px 18px;}
.daybadge .tag{font-weight:900;color:#04222a;background:var(--cyan);border-radius:8px;padding:4px 10px;font-size:14px;}
.daybadge .game{font-weight:800;font-size:18px;}
.daybadge .meta{color:var(--sub);font-size:13px;}

/* ---------- display layout ---------- */
.display-wrap{display:flex;gap:22px;padding:26px 32px;align-items:flex-start;}
.today-panel{flex:1 1 66%;min-width:0;}
.overall-panel{flex:1 1 34%;min-width:340px;}
.panel-title{display:flex;align-items:center;gap:10px;margin:0 0 14px;font-size:20px;font-weight:900;color:var(--gold);}
.panel-title .bar{width:6px;height:22px;background:var(--gold);border-radius:3px;display:inline-block;}

/* ---------- bracket ---------- */
.bracket-scroll{overflow-x:auto;padding-bottom:8px;}
.bracket{position:relative;display:flex;gap:56px;min-height:280px;padding:10px;}
.round-col{display:flex;flex-direction:column;justify-content:space-around;min-width:220px;}
.round-label{text-align:center;color:var(--sub);font-size:12px;font-weight:800;letter-spacing:2px;margin-bottom:8px;text-transform:uppercase;}
.match{background:linear-gradient(180deg,var(--panel),var(--panel2));border:2px solid var(--line);
  border-radius:12px;padding:8px;margin:10px 0;position:relative;transition:all .25s;}
.match.decided{border-color:var(--cyan);box-shadow:0 0 18px rgba(38,224,217,.35);}
.slot{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:8px;font-weight:700;font-size:14px;}
.slot.tbd{color:var(--sub);font-style:italic;font-weight:500;}
.slot .dot{width:10px;height:10px;border-radius:50%;flex:none;}
.slot.winner{background:rgba(255,209,102,.14);color:var(--gold);}
.slot.winner .name{position:relative;}
.slot.loser{opacity:.5;text-decoration:line-through;}
.slot-btn{all:unset;display:flex;align-items:center;gap:8px;width:100%;cursor:pointer;border-radius:8px;padding:7px 9px;}
.slot-btn:hover{background:rgba(255,255,255,.06);}
.match-meta{margin-top:4px;font-size:11px;color:var(--sub);padding:0 4px;}
.match-meta b{color:var(--orange2);}
svg.connectors{position:absolute;inset:0;pointer-events:none;overflow:visible;}
svg.connectors path{fill:none;stroke:var(--line);stroke-width:3;}
svg.connectors path.decided{stroke:var(--cyan);stroke-width:4;filter:drop-shadow(0 0 6px rgba(38,224,217,.7));}

/* ---------- ranking ---------- */
.ranking-list{display:flex;flex-direction:column;gap:10px;}
.rank-row{display:flex;align-items:center;gap:14px;background:linear-gradient(90deg,var(--panel),var(--panel2));
  border:2px solid var(--line);border-radius:12px;padding:10px 16px;}
.rank-row.r1{border-color:var(--gold);box-shadow:0 0 20px rgba(255,209,102,.3);}
.rank-row.r2{border-color:#c9d3e0;}
.rank-row.r3{border-color:#e0a672;}
.rank-num{font-size:22px;font-weight:900;width:38px;text-align:center;color:var(--sub);}
.rank-row.r1 .rank-num{color:var(--gold);font-size:28px;}
.rank-time{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--sub);font-weight:700;}

/* ---------- team chip ---------- */
.team-chip{display:flex;align-items:center;gap:10px;}
.team-avatar{width:34px;height:34px;border-radius:50%;object-fit:cover;background:#1c3a68;flex:none;border:2px solid rgba(255,255,255,.25);}
.team-avatar.big{width:52px;height:52px;}
.team-name{font-weight:800;}

/* ---------- overall top9 ---------- */
.top9{display:flex;flex-direction:column;gap:8px;}
.top9-row{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 14px;}
.top9-row.top3{background:linear-gradient(90deg,rgba(255,122,41,.16),var(--panel));border-color:var(--orange);}
.top9-rank{width:30px;text-align:center;font-weight:900;font-size:18px;color:var(--sub);}
.top9-row.top3 .top9-rank{color:var(--orange2);}
.top9-score{margin-left:auto;font-weight:900;font-size:18px;color:var(--cyan2);}

/* ---------- admin ---------- */
.admin-wrap{padding:20px 28px 80px;}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
.tab-btn{padding:9px 16px;border-radius:10px;border:2px solid var(--line);background:var(--panel);color:var(--text);font-weight:700;font-size:14px;}
.tab-btn.active{border-color:var(--orange);background:linear-gradient(90deg,#3a2410,#1a2540);color:var(--orange2);}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px;}
.card h3{margin:0 0 12px;font-size:16px;color:var(--cyan2);}
.grid-teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;}
.team-edit-card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;gap:10px;align-items:flex-start;}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:8px;}
.field label{font-size:11px;color:var(--sub);font-weight:700;}
.field input[type=text],.field input[type=number],.field select{background:#081a34;border:1px solid var(--line);color:var(--text);
  border-radius:8px;padding:7px 9px;font-size:13px;}
.field input[type=color]{width:44px;height:30px;border:none;background:none;padding:0;}
.small-btn{border:1px solid var(--line);background:#0d2140;color:var(--text);border-radius:8px;padding:6px 10px;font-size:12px;font-weight:700;}
.small-btn.primary{background:linear-gradient(90deg,var(--orange),var(--orange2));border:none;color:#241000;}
.small-btn.ghost{background:transparent;}
.small-btn:hover{filter:brightness(1.1);}
.day-header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:10px;}
.day-header .title{font-size:18px;font-weight:900;}
.day-header .sub{color:var(--sub);font-size:13px;}
.stopwatch-box{margin-top:8px;background:#081a34;border:1px dashed var(--line);border-radius:10px;padding:10px;}
.stopwatch-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px;}
.timer-display{font-variant-numeric:tabular-nums;font-size:20px;font-weight:900;color:var(--cyan2);min-width:80px;}
.rank-edit-row{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;}
.badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:800;}
.badge.auto{background:rgba(61,220,132,.15);color:var(--green);}
.floating-toggle{position:fixed;right:10px;bottom:10px;width:26px;height:26px;border-radius:50%;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);color:transparent;z-index:50;font-size:10px;}
.floating-toggle:hover{color:var(--sub);background:rgba(255,255,255,.1);}
.banner{padding:10px 18px;background:#3a1a12;border-bottom:2px solid var(--red);color:#ffd9c9;font-size:13px;}
.loading-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;}
.spinner{width:44px;height:44px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--orange);animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.table{width:100%;border-collapse:collapse;}
.table th,.table td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;}
.table th{color:var(--sub);font-weight:700;}
.exec-toggle{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub);}
.regulation h4{color:var(--orange2);margin:18px 0 8px;}
@media (max-width:1000px){.display-wrap{flex-direction:column;}.overall-panel{min-width:0;}}
</style>

<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef, useCallback, useLayoutEffect } = React;

/* ============================== constants ============================== */
const PALETTE = ["#ff7a29","#26e0d9","#ffd166","#ff5c8a","#7ee787","#5aa9ff","#c792ea","#ff9f45","#4dd0e1"];
const DAYS = [
  { key:"day1", label:"DAY 1", date:"9/7(월)", game:"자이언트 젠가", place:"본관동 로비", unit:"3인 1팀", format:"bracket", hasFirstMover:true },
  { key:"day2", label:"DAY 2", date:"9/8(화)", game:"모바일 카트라이더", place:"본관동 대강당", unit:"4vs4 팀전 · 3판 2선승", format:"bracket", hasSetScore:true },
  { key:"day3", label:"DAY 3", date:"9/9(수)", game:"팀빌딩 게임", place:"잔디광장", unit:"6인 1팀", format:"ranking" },
  { key:"day4", label:"DAY 4", date:"9/10(목)", game:"실내 컬링", place:"본관동 로비", unit:"4인 1팀", format:"bracket" },
];
const dayInfo = (k) => DAYS.find(d=>d.key===k);

/* ============================== bracket utils ============================== */
function buildBracket(teamIds){
  const n = teamIds.length;
  let size = 1; while(size<n) size*=2;
  const totalR1 = size/2;
  const byes = size - n;
  const realMatches = totalR1 - byes;
  let ti = 0;
  const round1 = [];
  for(let i=0;i<realMatches;i++){
    round1.push({ id:`r0m${i}`, teamAId:teamIds[ti++], teamBId:teamIds[ti++], winnerId:null, meta:{} });
  }
  for(let i=0;i<byes;i++){
    const team = teamIds[ti++];
    round1.push({ id:`r0m${realMatches+i}`, teamAId:team, teamBId:null, winnerId:team, meta:{auto:true} });
  }
  const rounds = [round1];
  let prevCount = totalR1, r = 1;
  while(prevCount>1){
    const cnt = prevCount/2;
    const round = [];
    for(let i=0;i<cnt;i++){
      round.push({ id:`r${r}m${i}`, teamASource:{round:r-1,match:i*2}, teamBSource:{round:r-1,match:i*2+1}, winnerId:null, meta:{} });
    }
    rounds.push(round);
    prevCount = cnt; r++;
  }
  return { rounds };
}
function getWinnerOf(bracket, round, idx){
  const m = bracket.rounds[round] && bracket.rounds[round][idx];
  return m ? (m.winnerId || null) : null;
}
function getSlotTeam(bracket, round, idx, side){
  const m = bracket.rounds[round][idx];
  if(side==="A"){
    if(m.teamAId) return m.teamAId;
    if(m.teamASource) return getWinnerOf(bracket, m.teamASource.round, m.teamASource.match);
    return null;
  } else {
    if(m.teamBId) return m.teamBId;
    if(m.teamBSource) return getWinnerOf(bracket, m.teamBSource.round, m.teamBSource.match);
    return null;
  }
}
function clearDownstream(bracket, round, idx){
  const next = round+1;
  if(!bracket.rounds[next]) return;
  bracket.rounds[next].forEach((m,i)=>{
    const depA = m.teamASource && m.teamASource.round===round && m.teamASource.match===idx;
    const depB = m.teamBSource && m.teamBSource.round===round && m.teamBSource.match===idx;
    if((depA||depB) && m.winnerId){
      m.winnerId = null; m.meta = {};
      clearDownstream(bracket, next, i);
    }
  });
}

/* ============================== default state ============================== */
function defaultTeams(){
  return Array.from({length:9},(_,i)=>({ id:`t${i+1}`, name:`${i+1}팀`, color:PALETTE[i] }));
}
function createDefaultState(){
  const teamIds = defaultTeams().map(t=>t.id);
  return {
    version:1,
    teams: defaultTeams(),
    days:{
      day1:{ bracket: buildBracket(teamIds) },
      day2:{ bracket: buildBracket(teamIds) },
      day3:{ mode:"auto", entries: teamIds.map(id=>({teamId:id, timeSec:null, manualRank:null})) },
      day4:{ bracket: buildBracket(teamIds) },
    },
    scoring:{
      day1:{ roundPoints:[10,20,30,40], multiplier:1.2, execTeams:[] },
      day2:{ roundPoints:[10,20,30,40], multiplier:1.2, execTeams:[] },
      day3:{ rankPoints:[100,90,80,70,60,50,40,30,20], multiplier:1.2, execTeams:[] },
      day4:{ roundPoints:[10,20,30,40], multiplier:1.2, execTeams:[] },
    },
    display:{ activeDayKey:"day1" },
  };
}
function deepClone(o){ return JSON.parse(JSON.stringify(o)); }

/* ============================== scoring ============================== */
function getRankedEntries(day3){
  const entries = day3.entries;
  if(day3.mode==="manual"){
    return entries.map((e,i)=>({ teamId:e.teamId, rank: e.manualRank!=null ? i+1 : null, timeSec:e.timeSec }))
      .map((e,i)=> e.manualRank!==undefined ? e : e);
  }
  const withTime = entries.filter(e=>e.timeSec!=null).sort((a,b)=>a.timeSec-b.timeSec);
  const withoutTime = entries.filter(e=>e.timeSec==null);
  const ranked = withTime.map((e,i)=>({teamId:e.teamId, rank:i+1, timeSec:e.timeSec}));
  withoutTime.forEach(e=>ranked.push({teamId:e.teamId, rank:null, timeSec:null}));
  return ranked;
}
function computeBracketScores(dayState, cfg){
  const scores = {};
  dayState.bracket.rounds.forEach((round, r)=>{
    round.forEach(m=>{
      if(m.winnerId) scores[m.winnerId] = (scores[m.winnerId]||0) + (cfg.roundPoints[r]||0);
    });
  });
  return scores;
}
function computeRankingScores(dayState, cfg){
  const scores = {};
  getRankedEntries(dayState).forEach(e=>{
    if(e.rank) scores[e.teamId] = cfg.rankPoints[e.rank-1]||0;
  });
  return scores;
}
function computeOverall(state){
  const perDay = {};
  const totals = {}; state.teams.forEach(t=>totals[t.id]=0);
  DAYS.forEach(d=>{
    const ds = state.days[d.key], cfg = state.scoring[d.key];
    let s = d.format==="ranking" ? computeRankingScores(ds,cfg) : computeBracketScores(ds,cfg);
    const applied = {};
    state.teams.forEach(t=>{
      let v = s[t.id]||0;
      if(cfg.execTeams && cfg.execTeams.includes(t.id)) v = v * (cfg.multiplier||1);
      applied[t.id] = v;
      totals[t.id] += v;
    });
    perDay[d.key] = applied;
  });
  return state.teams
    .map(t=>({ ...t, total: Math.round(totals[t.id]*10)/10, perDay: DAYS.map(d=>Math.round((perDay[d.key][t.id]||0)*10)/10) }))
    .sort((a,b)=>b.total-a.total);
}

/* ============================== misc utils ============================== */
function fmtTime(sec){
  if(sec==null || isNaN(sec)) return "-";
  const m = Math.floor(sec/60), s = (sec%60);
  return `${String(m).padStart(2,"0")}:${s.toFixed(2).padStart(5,"0")}`;
}
function parseTimeInput(str){
  if(str==null || str==="") return null;
  const s = String(str).trim();
  if(s.includes(":")){
    const [m,ss] = s.split(":");
    const v = (parseFloat(m)||0)*60 + (parseFloat(ss)||0);
    return isNaN(v) ? null : v;
  }
  const v = parseFloat(s);
  return isNaN(v) ? null : v;
}
function compressImage(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=>reject(new Error("read_failed"));
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=>reject(new Error("decode_failed"));
      img.onload = ()=>{
        let { width, height } = img;
        if(width>height){ if(width>maxDim){ height=Math.round(height*maxDim/width); width=maxDim; } }
        else { if(height>maxDim){ width=Math.round(width*maxDim/height); height=maxDim; } }
        const canvas = document.createElement("canvas");
        canvas.width=width; canvas.height=height;
        canvas.getContext("2d").drawImage(img,0,0,width,height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ============================== hooks ============================== */
function useDb(){
  const [db, setDb] = useState(undefined); // undefined=loading, null=unavailable
  useEffect(()=>{
    let alive = true;
    if(!window.claude || !window.claude.use){ setDb(null); return; }
    window.claude.use("db").then(d=>{ if(alive) setDb(d); }).catch(()=>{ if(alive) setDb(null); });
    return ()=>{ alive=false; };
  },[]);
  return db;
}
function useAppState(db){
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const dataRef = useRef(null);
  const initRef = useRef(false);
  const ref = useMemo(()=> db ? db.doc("app/state") : null, [db]);

  useEffect(()=>{
    if(db===null){ setData(createDefaultState()); setLoading(false); return; }
    if(!ref) return;
    const unsub = ref.onSnapshot((snap)=>{
      if(!snap.exists){
        if(!initRef.current){
          initRef.current = true;
          ref.set(createDefaultState()).catch(e=>setError(e));
        }
      } else {
        dataRef.current = snap.data();
        setData(snap.data());
      }
      setLoading(false);
    }, (e)=>{ setError(e); setLoading(false); });
    return unsub;
  },[ref, db]);

  const update = useCallback((fn)=>{
    const base = dataRef.current || createDefaultState();
    const next = fn(deepClone(base));
    if(!next) return Promise.resolve();
    dataRef.current = next;
    setData(next);
    if(ref){
      return ref.set(next).catch(e=>setError(e));
    }
    return Promise.resolve();
  },[ref]);

  return { state: data, loading, error, update, offline: db===null };
}
function useTeamImages(db){
  const [images, setImages] = useState({});
  const col = useMemo(()=> db ? db.collection("teamImages") : null, [db]);
  useEffect(()=>{
    if(!col) return;
    const unsub = col.onSnapshot((snap)=>{
      const map = {};
      snap.docs.forEach(d=>{ map[d.id] = d.data().dataUrl; });
      setImages(map);
    }, ()=>{});
    return unsub;
  },[col]);
  const setImage = useCallback((teamId, dataUrl)=>{
    if(!col) return Promise.reject(new Error("no_db"));
    return col.doc(teamId).set({ dataUrl });
  },[col]);
  return { images, setImage, available: !!col };
}

/* ============================== small components ============================== */
function LoadingScreen({label}){
  return (
    <div className="loading-screen">
      <div className="spinner"></div>
      <div style={{color:"var(--sub)"}}>{label || "불러오는 중..."}</div>
    </div>
  );
}
function TeamChip({team, image, size}){
  if(!team) return <span className="slot tbd">TBD</span>;
  return (
    <span className="team-chip">
      {image
        ? <img className={"team-avatar" + (size==="big"?" big":"")} src={image} />
        : <span className="dot" style={{width:size==="big"?52:22,height:size==="big"?52:22,borderRadius:"50%",background:team.color,flex:"none",border:"2px solid rgba(255,255,255,.25)"}}></span>}
      <span className="team-name">{team.name}</span>
    </span>
  );
}
function ConfirmSetWinner({label, onConfirm, changing}){
  const handle = ()=>{
    if(changing){
      if(!window.confirm("정말 변경하시겠습니까? 다음 라운드에 반영된 결과도 함께 초기화됩니다.")) return;
    }
    onConfirm();
  };
  return handle;
}

/* ============================== bracket board ============================== */
function BracketBoard({ bracket, teamsById, images, editable, onSetWinner, renderExtra }){
  const containerRef = useRef(null);
  const matchRefs = useRef({});
  const [lines, setLines] = useState([]);
  const setRef = (r,i) => (el)=>{ matchRefs.current[`${r}-${i}`] = el; };

  const recompute = useCallback(()=>{
    const cont = containerRef.current;
    if(!cont) return;
    const cRect = cont.getBoundingClientRect();
    const newLines = [];
    bracket.rounds.forEach((round, r)=>{
      if(r === bracket.rounds.length-1) return;
      const nextRound = bracket.rounds[r+1];
      round.forEach((m, i)=>{
        const targetIdx = nextRound.findIndex(nm =>
          (nm.teamASource && nm.teamASource.round===r && nm.teamASource.match===i) ||
          (nm.teamBSource && nm.teamBSource.round===r && nm.teamBSource.match===i));
        if(targetIdx<0) return;
        const srcEl = matchRefs.current[`${r}-${i}`];
        const tgtEl = matchRefs.current[`${r+1}-${targetIdx}`];
        if(!srcEl || !tgtEl) return;
        const sr = srcEl.getBoundingClientRect(), tr = tgtEl.getBoundingClientRect();
        newLines.push({
          x1: sr.right - cRect.left, y1: sr.top + sr.height/2 - cRect.top,
          x2: tr.left - cRect.left, y2: tr.top + tr.height/2 - cRect.top,
          decided: !!round[i].winnerId,
        });
      });
    });
    setLines(newLines);
  },[bracket]);

  useLayoutEffect(()=>{
    recompute();
    const onResize = ()=>recompute();
    window.addEventListener("resize", onResize);
    const ro = new ResizeObserver(()=>recompute());
    if(containerRef.current) ro.observe(containerRef.current);
    return ()=>{ window.removeEventListener("resize", onResize); ro.disconnect(); };
  },[recompute]);

  return (
    <div className="bracket-scroll">
      <div className="bracket" ref={containerRef}>
        <svg className="connectors">
          {lines.map((l,idx)=>{
            const midX = (l.x1+l.x2)/2;
            const d = `M ${l.x1} ${l.y1} H ${midX} V ${l.y2} H ${l.x2}`;
            return <path key={idx} d={d} className={l.decided?"decided":""} />;
          })}
        </svg>
        {bracket.rounds.map((round, r)=>(
          <div className="round-col" key={r}>
            <div className="round-label">{r===bracket.rounds.length-1 ? "결승" : `${r+1}라운드`}</div>
            {round.map((m, i)=>{
              const aId = getSlotTeam(bracket, r, i, "A");
              const bId = getSlotTeam(bracket, r, i, "B");
              const aTeam = aId ? teamsById[aId] : null;
              const bTeam = bId ? teamsById[bId] : null;
              const isBye = m.meta && m.meta.auto;
              const canPick = editable && !isBye && aTeam && bTeam;
              const rowClass = (id)=> id && m.winnerId ? (id===m.winnerId?"slot winner":"slot loser") : "slot";
              const pick = (teamId)=>{
                if(!canPick) return;
                const changing = !!m.winnerId && m.winnerId!==teamId;
                if(changing && !window.confirm("정말 변경하시겠습니까? 다음 라운드에 반영된 결과도 함께 초기화됩니다.")) return;
                onSetWinner(r, i, teamId);
              };
              return (
                <div className={"match" + (m.winnerId?" decided":"")} key={m.id} ref={setRef(r,i)}>
                  {canPick ? (
                    <button className="slot-btn" onClick={()=>pick(aId)}>
                      <span className={rowClass(aId)} style={{width:"100%"}}><TeamChip team={aTeam} image={images[aId]} /></span>
                    </button>
                  ) : (
                    <div className={rowClass(aId) + (!aTeam?" tbd":"")}><TeamChip team={aTeam} image={aId&&images[aId]} /></div>
                  )}
                  {canPick ? (
                    <button className="slot-btn" onClick={()=>pick(bId)}>
                      <span className={rowClass(bId)} style={{width:"100%"}}><TeamChip team={bTeam} image={images[bId]} /></span>
                    </button>
                  ) : (
                    <div className={rowClass(bId) + (!bTeam?" tbd":"")}><TeamChip team={bTeam} image={bId&&images[bId]} /></div>
                  )}
                  {isBye && <div className="match-meta"><span className="badge auto">부전승</span></div>}
                  {m.meta && m.meta.firstMoverId && teamsById[m.meta.firstMoverId] &&
                    <div className="match-meta">{m.meta.firstMoverLabel||"선공"}: <b>{teamsById[m.meta.firstMoverId].name}</b></div>}
                  {m.meta && m.meta.setScore &&
                    <div className="match-meta">세트 스코어: <b>{m.meta.setScore}</b></div>}
                  {renderExtra && aTeam && bTeam && !isBye && renderExtra(m, r, i)}
                </div>
              );
            })}
          </div>
        ))}
      </div>
    </div>
  );
}

/* ============================== admin: stopwatch (day1 first mover) ============================== */
function FirstMoverPanel({ match, onUpdate, teamsById, aId, bId }){
  const target = (match.meta && match.meta.timerTarget) || 10;
  const [running, setRunning] = useState(false);
  const [elapsed, setElapsed] = useState(0);
  const startRef = useRef(0);
  const rafRef = useRef(null);
  const [aVal, setAVal] = useState(match.meta && match.meta.teamAStopTime!=null ? String(match.meta.teamAStopTime) : "");
  const [bVal, setBVal] = useState(match.meta && match.meta.teamBStopTime!=null ? String(match.meta.teamBStopTime) : "");

  useEffect(()=>{
    if(!running) return;
    const tick = ()=>{
      setElapsed((performance.now()-startRef.current)/1000);
      rafRef.current = requestAnimationFrame(tick);
    };
    rafRef.current = requestAnimationFrame(tick);
    return ()=>cancelAnimationFrame(rafRef.current);
  },[running]);

  const start = ()=>{ startRef.current = performance.now(); setElapsed(0); setRunning(true); };
  const stopA = ()=>{ if(running){ setAVal(elapsed.toFixed(2)); } };
  const stopB = ()=>{ if(running){ setBVal(elapsed.toFixed(2)); } };
  const stopAll = ()=> setRunning(false);

  const judge = ()=>{
    const a = parseFloat(aVal), b = parseFloat(bVal);
    if(isNaN(a) || isNaN(b)){ window.alert("두 팀의 시간을 모두 입력해주세요."); return; }
    const diffA = Math.abs(target-a), diffB = Math.abs(target-b);
    const winnerId = diffA<=diffB ? aId : bId;
    onUpdate({ timerTarget:target, teamAStopTime:a, teamBStopTime:b, firstMoverId:winnerId, firstMoverLabel:(match.meta&&match.meta.firstMoverLabel)||"선공" });
  };

  return (
    <div className="stopwatch-box" onClick={e=>e.stopPropagation()}>
      <div className="stopwatch-row">
        <span className="timer-display">{elapsed.toFixed(2)}s</span>
        {!running
          ? <button className="small-btn" onClick={start}>시작</button>
          : <button className="small-btn" onClick={stopAll}>정지</button>}
        <span style={{fontSize:11,color:"var(--sub)"}}>목표 {target}s</span>
      </div>
      <div className="stopwatch-row">
        <button className="small-btn" onClick={stopA} disabled={!running}>{teamsById[aId] && teamsById[aId].name} 정지</button>
        <input type="text" style={{width:70,background:"#081a34",border:"1px solid var(--line)",color:"var(--text)",borderRadius:8,padding:"6px 8px"}} value={aVal} onChange={e=>setAVal(e.target.value)} placeholder="시간(초)" />
        <button className="small-btn" onClick={stopB} disabled={!running}>{teamsById[bId] && teamsById[bId].name} 정지</button>
        <input type="text" style={{width:70,background:"#081a34",border:"1px solid var(--line)",color:"var(--text)",borderRadius:8,padding:"6px 8px"}} value={bVal} onChange={e=>setBVal(e.target.value)} placeholder="시간(초)" />
        <button className="small-btn primary" onClick={judge}>판정</button>
      </div>
    </div>
  );
}

/* ============================== admin: day tab ============================== */
function DayTab({ dayKey, state, update, teamsById, images }){
  const info = dayInfo(dayKey);
  const dayState = state.days[dayKey];

  const setWinner = (r,i,teamId)=>{
    update(s=>{
      const b = s.days[dayKey].bracket;
      const m = b.rounds[r][i];
      if(m.winnerId===teamId) return null;
      m.winnerId = teamId;
      clearDownstream(b, r, i);
      return s;
    });
  };
  const setMeta = (r,i,patch)=>{
    update(s=>{
      const m = s.days[dayKey].bracket.rounds[r][i];
      m.meta = { ...m.meta, ...patch };
      return s;
    });
  };

  if(info.format==="bracket"){
    return (
      <div className="card">
        <div className="day-header">
          <div className="title">{info.label} · {info.game}</div>
          <div className="sub">{info.date} · {info.place} · {info.unit}</div>
        </div>
        <BracketBoard
          bracket={dayState.bracket}
          teamsById={teamsById}
          images={images}
          editable={true}
          onSetWinner={(r,i,teamId)=>setWinner(r,i,teamId)}
          renderExtra={(m,r,i)=>{
            const aId = getSlotTeam(dayState.bracket, r, i, "A");
            const bId = getSlotTeam(dayState.bracket, r, i, "B");
            return (
              <div>
                {info.hasFirstMover &&
                  <FirstMoverPanel match={m} teamsById={teamsById} aId={aId} bId={bId}
                    onUpdate={(patch)=>setMeta(r,i,patch)} />}
                {info.hasSetScore &&
                  <div className="stopwatch-box" onClick={e=>e.stopPropagation()}>
                    <div className="field" style={{marginBottom:0}}>
                      <label>세트 스코어 (예: 2:1)</label>
                      <input type="text" defaultValue={(m.meta&&m.meta.setScore)||""} placeholder="2:1"
                        onBlur={(e)=>setMeta(r,i,{setScore:e.target.value})} />
                    </div>
                  </div>}
              </div>
            );
          }}
        />
      </div>
    );
  }

  // day3 ranking editor
  const entries = dayState.entries;
  const toggleMode = (mode)=> update(s=>{ s.days.day3.mode = mode; return s; });
  const setTime = (teamId, val)=> update(s=>{
    const e = s.days.day3.entries.find(x=>x.teamId===teamId);
    e.timeSec = parseTimeInput(val);
    return s;
  });
  const move = (idx, dir)=> update(s=>{
    const arr = s.days.day3.entries;
    const j = idx+dir;
    if(j<0||j>=arr.length) return null;
    const tmp = arr[idx]; arr[idx]=arr[j]; arr[j]=tmp;
    return s;
  });
  const ranked = getRankedEntries(dayState);
  const rankOf = Object.fromEntries(ranked.map(e=>[e.teamId,e.rank]));

  return (
    <div className="card">
      <div className="day-header">
        <div className="title">{info.label} · {info.game}</div>
        <div className="sub">{info.date} · {info.place} · {info.unit}</div>
      </div>
      <div style={{marginBottom:12,display:"flex",gap:8}}>
        <button className={"small-btn" + (dayState.mode!=="manual"?" primary":"")} onClick={()=>toggleMode("auto")}>자동 정렬 (완료 시간 기준)</button>
        <button className={"small-btn" + (dayState.mode==="manual"?" primary":"")} onClick={()=>toggleMode("manual")}>수동 순서 지정</button>
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:8}}>
        {entries.map((e,idx)=>{
          const t = teamsById[e.teamId];
          return (
            <div className="rank-edit-row" key={e.teamId}>
              <div style={{width:30,textAlign:"center",fontWeight:900,color:"var(--gold)"}}>{rankOf[e.teamId]||"-"}</div>
              <TeamChip team={t} image={images[e.teamId]} />
              {dayState.mode!=="manual"
                ? <input type="text" style={{marginLeft:"auto",width:100}} placeholder="mm:ss"
                    defaultValue={e.timeSec!=null?fmtTime(e.timeSec):""}
                    onBlur={(ev)=>setTime(e.teamId, ev.target.value)} />
                : <div style={{marginLeft:"auto",display:"flex",gap:6}}>
                    <button className="small-btn" onClick={()=>move(idx,-1)}>↑</button>
                    <button className="small-btn" onClick={()=>move(idx,1)}>↓</button>
                  </div>}
            </div>
          );
        })}
      </div>
    </div>
  );
}

  const setRankPoints = (dayKey, idx, val)=> update(s=>{

    s.scoring[dayKey].multiplier = parseFloat(val)||1; return s;

                {cfg.rankPoints.map((p,idx)=>(
                  <div className="field" key={idx}>
                    <label>{idx+1}위 점수</label>
                    <input type="number" defaultValue={p} onBlur={(e)=>setRankPoints(d.key, idx, e.target.value)} style={{width:80}} />

        {tabs.map(t=>(
          <button key={t.key} className={"tab-btn" + (tab===t.key?" active":"")} onClick={()=>setTab(t.key)}>{t.label}</button>
        ))}
      </div>
      {tab==="control" && <ControlTab state={state} update={update} />}
      {tab==="teams" && <TeamsTab state={state} update={update} images={images} setImage={setImage} imagesAvailable={imagesAvailable} />}
      {tab==="day1" && <DayTab dayKey="day1" state={state} update={update} teamsById={teamsById} images={images} />}
      {tab==="day2" && <DayTab dayKey="day2" state={state} update={update} teamsById={teamsById} images={images} />}
      {tab==="day3" && <DayTab dayKey="day3" state={state} update={update} teamsById={teamsById} images={images} />}
      {tab==="day4" && <DayTab dayKey="day4" state={state} update={update} teamsById={teamsById} images={images} />}
      {tab==="scoring" && <ScoringTab state={state} update={update} />}
      {tab==="rules" && <RulesTab state={state} />}
    </div>
  );
}

/* ============================== app root ============================== */
function App(){
  const db = useDb();
  const { state, loading, error, update, offline } = useAppState(db);
  const { images, setImage, available: imagesAvailable } = useTeamImages(db);
  const [mode, setMode] = useState(()=>{
    try{ return new URLSearchParams(window.location.search).get("admin")==="1" ? "admin" : "display"; }
    catch(e){ return "display"; }
  });

  if(loading || !state) return <LoadingScreen />;

  return (
    <div className="app">
      {offline && <div className="banner">⚠️ 실시간 동기화를 사용할 수 없어 이 브라우저에서만 임시로 동작합니다. (조직 내부 로그인 상태에서 다시 열어주세요)</div>}
      {error && <div className="banner">⚠️ 저장 중 문제가 발생했습니다: {error.message || "알 수 없는 오류"} — 입력을 다시 시도해주세요.</div>}
      {mode==="display" ? <DisplayView state={state} images={images} /> : <AdminView state={state} update={update} images={images} setImage={setImage} imagesAvailable={imagesAvailable} />}
      <button className="floating-toggle" onClick={()=>setMode(m=>m==="admin"?"display":"admin")} title="관리자 모드 전환">·</button>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
